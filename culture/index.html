<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>my culture</title>
  <link rel="stylesheet" href="../shared.css" />
  <style>
    body { overflow-x: hidden; }
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(260px, 0.55fr);
      gap: 18px;
      align-items: stretch;
      margin-bottom: 18px;
    }
    .hero-main {
      position: relative;
      overflow: hidden;
      padding: clamp(24px, 5vw, 46px);
    }
    .hero-main::after {
      content: "";
      position: absolute;
      right: -70px;
      top: -85px;
      width: 240px;
      height: 240px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(255,217,235,0.42), rgba(139,215,255,0.38));
    }
    .eyebrow {
      position: relative;
      z-index: 1;
      display: inline-flex;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.62);
      border: 1px solid var(--my-line);
      color: var(--my-muted);
      font-size: 0.9rem;
      margin-bottom: 14px;
    }
    h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: clamp(2.6rem, 8vw, 5.8rem);
      line-height: 0.9;
      letter-spacing: -0.06em;
      color: #172033;
    }
    .subtitle {
      position: relative;
      z-index: 1;
      margin: 16px 0 0;
      color: var(--my-muted);
      font-size: clamp(0.95rem, 2vw, 1.08rem);
      line-height: 1.7;
    }
    .side-note {
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
    }
    .side-note .label { color: var(--my-muted); font-size: 0.9rem; }
    .side-note .value { font-size: 2rem; line-height: 1.1; letter-spacing: -0.05em; }
    .game-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .game-link {
      min-height: 210px;
      padding: 18px;
      color: var(--my-ink);
      text-decoration: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
    }
    .game-link:hover {
      transform: translateY(-4px);
      filter: brightness(1.02);
      box-shadow: 0 24px 50px rgba(94,120,160,0.2);
    }
    .icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 17px;
      background: rgba(255,255,255,0.68);
      border: 1px solid rgba(120,144,180,0.18);
      font-size: 1.55rem;
    }
    .game-title {
      margin: 18px 0 7px;
      font-size: 1.26rem;
      line-height: 1.2;
      letter-spacing: -0.04em;
    }
    .game-desc {
      margin: 0;
      color: var(--my-muted);
      font-size: 0.88rem;
      line-height: 1.55;
    }
    .created {
      margin-top: 18px;
      color: #7b8190;
      font-size: 0.8rem;
    }
    @media (max-width: 980px) {
      .hero { grid-template-columns: 1fr; }
      .game-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .game-grid { grid-template-columns: 1fr; }
      .game-link { min-height: 180px; }
    }
  </style>
</head>
<body class="zip-soft">
  <nav class="zip-topnav">
    <a class="zip-home" href="../">← my zip</a>
  </nav>
  <main class="zip-page">
    <section class="hero">
      <div class="zip-card hero-main">
        <div class="eyebrow">my culture</div>
        <h1>my culture</h1>
        <p class="subtitle">원하는 것을 고르면 각 페이지로 이동합니다.</p>
      </div>
      <aside class="zip-card side-note">
        <div class="value">읽고 보러 다닌<br>기록</div>
        <div class="label">또래는 요즘 뭘 읽나<br>퇴근하고 가는 프리즈 나잇</div>
      </aside>
    </section>

    <section class="game-grid" aria-label="culture list">
      <a class="zip-card game-link" href="reading-trend-digging/">
        <div>
          <div class="icon">📖</div>
          <h2 class="game-title">Reading Trend Digging</h2>
          <p class="game-desc">2030 독서 트렌드 리서치</p>
        </div>
        <div class="created">Created Aug 26, 2026</div>
      </a>

      <a class="zip-card game-link" href="frieze-week-2026/">
        <div>
          <div class="icon">🎨</div>
          <h2 class="game-title">Frieze Week 2026</h2>
          <p class="game-desc">퇴근 후 가는 프리즈 위크 서울 타임테이블</p>
        </div>
        <div class="created">Created Aug 26, 2026</div>
      </a>

    </section>
  </main>
</body>
</html>
