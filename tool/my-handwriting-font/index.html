<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff7ec" />
    <title>My Handwriting Font · my tool</title>
    <link rel="stylesheet" href="../../shared.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      .wrap {
        max-width: 1150px;
        margin: 22px auto 60px;
        padding: 0 18px;
      }
      .hero,
      .panel {
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid var(--my-line);
        border-radius: 26px;
        box-shadow: var(--my-shadow);
        backdrop-filter: blur(18px);
        padding: 24px;
      }
      .hero {
        margin-bottom: 18px;
      }
      .hero h1 {
        font-size: clamp(2rem, 5vw, 3.3rem);
        margin: 4px 0 8px;
        letter-spacing: -0.05em;
      }
      .hero p,
      .muted,
      .note {
        color: var(--my-muted);
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) minmax(290px, 0.8fr);
        gap: 18px;
      }
      .side {
        display: grid;
        gap: 18px;
        align-content: start;
      }
      h2 {
        font-size: 1.3rem;
        margin: 0 0 14px;
      }
      .tabs,
      .controls,
      .actions,
      .extras {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      button,
      .upload {
        font: inherit;
        border: 1px solid var(--my-line);
        background: #fff;
        border-radius: 12px;
        padding: 10px 14px;
        color: var(--my-ink);
        cursor: pointer;
      }
      button:hover,
      .upload:hover {
        border-color: #d9b8c8;
      }
      button.active,
      .primary {
        background: #f1dce6;
        border-color: #dfc2cf;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      .glyphs {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(39px, 1fr));
        gap: 6px;
        max-height: 180px;
        overflow: auto;
        margin: 16px 0;
      }
      .glyphs button {
        padding: 8px 2px;
        border-radius: 9px;
      }
      .glyphs button.done {
        background: #edf3f0;
      }
      .glyphs button.selected {
        background: #f3dbe5;
        border-color: #ffc8e1;
        box-shadow: inset 0 0 0 1px #ffc8e1;
        outline: none;
      }
      .glyphs button.done:not(.selected) {
        background: #edf3f0;
        border-color: #d6e4dc;
      }
      .drawing {
        width: 100%;
        display: block;
        aspect-ratio: 1;
        touch-action: none;
        border: 1px solid #e8dce0;
        border-radius: 16px;
        background: #fffcfb;
        max-height: 480px;
        object-fit: contain;
        margin: 12px 0;
      }
      label {
        display: block;
        margin: 10px 0;
      }
      .field input,
      .field textarea,
      .field select {
        width: 100%;
        border: 1px solid var(--my-line);
        border-radius: 12px;
        padding: 11px;
        background: #fff;
        font: inherit;
        color: var(--my-ink);
      }
      textarea {
        min-height: 90px;
        resize: vertical;
      }
      .sample {
        background: #fff;
        border: 1px solid var(--my-line);
        border-radius: 15px;
        padding: 15px;
        line-height: 1.9;
        min-height: 110px;
        display: flex;
        flex-wrap: wrap;
        align-content: start;
      }
      .sample .g {
        height: 42px;
        width: 35px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .sample svg {
        width: 100%;
        height: 100%;
      }
      .sample .linebreak {
        flex-basis: 100%;
        height: 0;
      }
      .full {
        width: 100%;
        margin: 10px 0;
      }
      .note {
        font-size: 0.85rem;
        line-height: 1.7;
      }
      #status {
        min-height: 40px;
        overflow-wrap: anywhere;
      }
      @media (max-width: 820px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .hero,
        .panel {
          padding: 18px;
        }
      }
    </style>
  </head>
  <body class="zip-soft">
    <nav class="zip-topnav">
      <a href="../" class="zip-home">← my tool</a><span class="zip-date">Created Nov 16, 2026</span>
    </nav>
    <div class="wrap">
      <section class="hero">
        <div class="muted">MY TOOL</div>
        <h1>My Handwriting Font</h1>
        <p>직접 쓴 글씨를 모아 나만의 폰트 파일로 저장할 수 있어요.</p>
      </section>
      <div class="layout">
        <section class="panel">
          <h2>글씨 쓰기 <span id="progress" class="muted"></span></h2>
          <div class="tabs">
            <button data-set="ko" class="active">한글 자모</button><button data-set="en">영문</button
            ><button data-set="num">숫자·기호</button>
          </div>
          <div id="glyphs" class="glyphs"></div>
          <div class="controls">
            <label>펜 굵기 <input id="pen" type="range" min="2" max="20" value="8" /></label>
          </div>
          <canvas class="drawing" id="canvas" width="560" height="560" aria-label="글씨 입력 영역"></canvas>
          <div class="actions">
            <button id="undo">한 획 취소</button><button id="clear">지우기</button
            ><button id="next" class="primary">다음 글자 →</button>
          </div>
          <p class="note">입력한 글씨는 자동 저장됩니다.</p>
        </section>
        <div class="side">
          <section class="panel">
            <h2>미리보기</h2>
            <label class="field">미리볼 문장<textarea id="sample">꾸준히</textarea></label>
            <div class="sample" id="preview"></div>
            <p class="note">아직 쓰지 않은 글자는 미리보기에서 기본 글꼴로 보여요.</p>
          </section>
          <section class="panel">
            <h2>폰트 저장</h2>
            <label class="field">폰트 이름<input id="family" value="My Handwriting" /></label
            ><label class="field">제작자<input id="designer" value="Me" /></label>
            <label class="field"
              >한글 범위<select id="range">
                <option value="2350">주요 2,350자</option>
                <option value="11172">현대 한글 11,172자 전체</option>
              </select></label
            >
            <button class="primary full" id="export">TTF 폰트 다운로드</button>
            <p class="note" id="status" role="status">
              한글 자모 24자를 모두 쓰면 한글 폰트를 만들 수 있어요.
            </p>
            <div class="extras">
              <button id="backup">JSON 백업</button
              ><label class="upload"
                >백업 불러오기<input id="restore" type="file" accept=".json,application/json" hidden
              /></label>
            </div>
          </section>
        </div>
      </div>
      <p class="note">입력한 자모를 조합해 한글 글자를 만들어요. 조합된 글자는 직접 쓴 모양과 조금 다를 수 있어요.</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
    <script>
      'use strict';
      const C = 'ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ',
        V = 'ㅏㅑㅓㅕㅗㅛㅜㅠㅡㅣ',
        EN = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz',
        NUM = '0123456789.,!?-+():;@#%&/',
        SETS = {
          ko: [...C, ...V],
          en: [...EN],
          num: [...NUM],
        };
      const CHO = [...'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'],
        JUNG = [...'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ'],
        JONG = [...' ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ'];
      JONG[0] = '';
      const MIX = {
        ㄲ: 'ㄱㄱ',
        ㄸ: 'ㄷㄷ',
        ㅃ: 'ㅂㅂ',
        ㅆ: 'ㅅㅅ',
        ㅉ: 'ㅈㅈ',
        ㄳ: 'ㄱㅅ',
        ㄵ: 'ㄴㅈ',
        ㄶ: 'ㄴㅎ',
        ㄺ: 'ㄹㄱ',
        ㄻ: 'ㄹㅁ',
        ㄼ: 'ㄹㅂ',
        ㄽ: 'ㄹㅅ',
        ㄾ: 'ㄹㅌ',
        ㄿ: 'ㄹㅍ',
        ㅀ: 'ㄹㅎ',
        ㅄ: 'ㅂㅅ',
        ㅐ: 'ㅏㅣ',
        ㅒ: 'ㅑㅣ',
        ㅔ: 'ㅓㅣ',
        ㅖ: 'ㅕㅣ',
        ㅘ: 'ㅗㅏ',
        ㅙ: 'ㅗㅐ',
        ㅚ: 'ㅗㅣ',
        ㅝ: 'ㅜㅓ',
        ㅞ: 'ㅜㅔ',
        ㅟ: 'ㅜㅣ',
        ㅢ: 'ㅡㅣ',
      };
      const $ = (s) => document.querySelector(s),
        canvas = $('#canvas'),
        ctx = canvas.getContext('2d'),
        key = 'my-zip-all-handwriting-v1';
      let saved = {};
      try {
        saved = JSON.parse(localStorage.getItem(key) || '{}');
      } catch {}
      let data = saved.glyphs || {},
        group = 'ko',
        letter = 'ㄱ',
        strokes = [],
        active = null;
      $('#family').value = saved.family || 'My Handwriting';
      $('#designer').value = saved.designer || 'Me';
      function persist() {
        try {
          localStorage.setItem(
            key,
            JSON.stringify({
              glyphs: data,
              family: $('#family').value,
              designer: $('#designer').value,
            }),
          );
        } catch {
          $('#status').textContent = '이 브라우저의 저장 공간이 부족해요. 작성한 글씨를 백업 파일로 저장해 주세요.';
        }
      }
      function save() {
        if (strokes.length) data[letter] = structuredClone(strokes);
        else delete data[letter];
        persist();
      }
      function pick(ch) {
        save();
        letter = ch;
        strokes = structuredClone(data[ch] || []);

        draw();
        refresh();
      }
      function refresh() {
        const arr = SETS[group],
          n = arr.filter((c) => data[c]?.length).length;
        $('#progress').textContent = n + ' / ' + arr.length;
        $('#glyphs').replaceChildren();
        for (const c of arr) {
          const b = document.createElement('button');
          b.textContent = c;
          b.className = (c === letter ? 'selected ' : '') + (data[c]?.length ? 'done' : '');
          b.setAttribute('aria-pressed', String(c === letter));
          b.onclick = () => pick(c);
          $('#glyphs').append(b);
        }
        preview();
      }
      function draw() {
        ctx.fillStyle = '#fffcfb';
        ctx.fillRect(0, 0, 560, 560);
        ctx.strokeStyle = '#eee1e7';
        ctx.lineWidth = 1;
        ctx.setLineDash([7, 9]);
        for (const p of [140, 280, 420]) {
          ctx.beginPath();
          ctx.moveTo(p, 0);
          ctx.lineTo(p, 560);
          ctx.moveTo(0, p);
          ctx.lineTo(560, p);
          ctx.stroke();
        }
        ctx.setLineDash([]);
        ctx.strokeStyle = '#2d3039';
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        for (const s of [...strokes, ...(active ? [active] : [])]) {
          if (!s.points.length) continue;
          ctx.beginPath();
          ctx.lineWidth = s.width * 2;
          ctx.moveTo(s.points[0][0] * 560, s.points[0][1] * 560);
          for (const p of s.points.slice(1)) ctx.lineTo(p[0] * 560, p[1] * 560);
          if (s.points.length === 1) {
            ctx.lineTo(s.points[0][0] * 560 + 0.1, s.points[0][1] * 560 + 0.1);
          }
          ctx.stroke();
        }
      }
      function point(e) {
        const r = canvas.getBoundingClientRect();
        return [
          Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)),
          Math.max(0, Math.min(1, (e.clientY - r.top) / r.height)),
        ];
      }
      canvas.onpointerdown = (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        e.preventDefault();
        canvas.setPointerCapture(e.pointerId);
        active = {
          width: Number($('#pen').value),
          points: [point(e)],
        };
        draw();
      };
      canvas.onpointermove = (e) => {
        if (!active) return;
        const p = point(e),
          q = active.points.at(-1);
        if (Math.hypot(p[0] - q[0], p[1] - q[1]) > 0.002) {
          active.points.push(p);
          draw();
        }
      };
      canvas.onpointerup = (e) => {
        if (!active) return;
        active.points.push(point(e));
        strokes.push(active);
        active = null;
        save();
        draw();
        refresh();
      };
      canvas.onpointercancel = () => {
        active = null;
        draw();
      };
      $('#undo').onclick = () => {
        strokes.pop();
        save();
        draw();
        refresh();
      };
      $('#clear').onclick = () => {
        strokes = [];
        save();
        draw();
        refresh();
      };
      $('#next').onclick = () => {
        const a = SETS[group];
        pick(a[(a.indexOf(letter) + 1) % a.length]);
      };
      document.querySelectorAll('[data-set]').forEach(
        (b) =>
          (b.onclick = () => {
            group = b.dataset.set;
            document.querySelectorAll('[data-set]').forEach((v) => v.classList.toggle('active', v === b));
            pick(SETS[group][0]);
          }),
      );
      $('#family').oninput = persist;
      $('#designer').oninput = persist;
      $('#sample').oninput = preview;
      function transform(lines, [x, y, w, h]) {
        return lines.map((s) => ({
          width: s.width * Math.min(w, h),
          points: s.points.map((p) => [x + w * p[0], y + h * p[1]]),
        }));
      }
      function component(ch, rect, depth = 0) {
        if (depth > 4) return [];
        if (data[ch]?.length) return transform(data[ch], rect);
        const parts = MIX[ch];
        if (!parts) return [];
        const [x, y, w, h] = rect;
        if ('ㅘㅙㅚㅝㅞㅟㅢ'.includes(ch)) {
          return [
            ...component(parts[0], [x, y, w, h * 0.52], depth + 1),
            ...component(parts[1], [x + w * 0.07, y + h * 0.46, w * 0.93, h * 0.54], depth + 1),
          ];
        }
        return [
          ...component(parts[0], [x, y, w * 0.49, h], depth + 1),
          ...component(parts[1], [x + w * 0.51, y, w * 0.49, h], depth + 1),
        ];
      }
      function linesFor(ch) {
        const cp = ch.codePointAt(0);
        if (cp < 0xac00 || cp > 0xd7a3) return component(ch, [0, 0, 1, 1]);
        const n = cp - 0xac00,
          c = CHO[Math.floor(n / 588)],
          v = JUNG[Math.floor((n % 588) / 28)],
          f = JONG[n % 28],
          h = f ? 0.72 : 1,
          hor = 'ㅗㅛㅜㅠㅡ'.includes(v),
          mix = 'ㅘㅙㅚㅝㅞㅟㅢ'.includes(v);
        const a = hor
            ? [0.09, 0.05, 0.82, h * 0.48]
            : mix
              ? [0.07, 0.05, 0.48, h * 0.62]
              : [0.06, 0.07, 0.46, h * 0.85],
          b = hor
            ? [0.09, h * 0.52, 0.82, h * 0.43]
            : mix
              ? [0.4, 0.05, 0.54, h * 0.86]
              : [0.49, 0.06, 0.46, h * 0.85];
        return [...component(c, a), ...component(v, b), ...(f ? component(f, [0.14, 0.73, 0.72, 0.23]) : [])];
      }
      function preview() {
        const root = $('#preview');
        root.replaceChildren();
        for (const ch of [...$('#sample').value.slice(0, 200)]) {
          if (ch === '\n') {
            const z = document.createElement('span');
            z.className = 'linebreak';
            root.append(z);
            continue;
          }
          const lines = linesFor(ch),
            el = document.createElement('span');
          el.className = 'g';
          if (!lines.length) {
            el.textContent = ch;
            root.append(el);
            continue;
          }
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          svg.setAttribute('viewBox', '0 0 100 100');
          for (const s of lines) {
            if (!s.points.length) continue;
            const p = document.createElementNS(svg.namespaceURI, 'path');
            p.setAttribute(
              'd',
              s.points
                .map((v, i) => (i ? 'L' : 'M') + (v[0] * 100).toFixed(2) + ' ' + (v[1] * 100).toFixed(2))
                .join(' '),
            );
            p.setAttribute('stroke', '#293042');
            p.setAttribute('stroke-width', Math.max(1, s.width * 0.5));
            p.setAttribute('stroke-linecap', 'round');
            p.setAttribute('stroke-linejoin', 'round');
            p.setAttribute('fill', 'none');
            svg.append(p);
          }
          el.append(svg);
          root.append(el);
        }
      }
      function pathFor(ch) {
        const path = new opentype.Path();
        for (const s of linesFor(ch)) {
          const p = s.points.map((a) => [a[0] * 850, (1 - a[1]) * 850]),
            r = Math.max(1.5, s.width * 1.6);
          if (!p.length) continue;
          if (p.length === 1) {
            for (let j = 0; j < 16; j++) {
              const a = (j * Math.PI) / 8,
                x = p[0][0] + r * Math.cos(a),
                y = p[0][1] + r * Math.sin(a);
              j ? path.lineTo(x, y) : path.moveTo(x, y);
            }
            path.close();
            continue;
          }
          const left = [],
            right = [];
          for (let j = 0; j < p.length; j++) {
            const a = p[Math.max(0, j - 1)],
              b = p[Math.min(p.length - 1, j + 1)],
              dx = b[0] - a[0],
              dy = b[1] - a[1],
              len = Math.hypot(dx, dy) || 1;
            left.push([p[j][0] - (dy * r) / len, p[j][1] + (dx * r) / len]);
            right.push([p[j][0] + (dy * r) / len, p[j][1] - (dx * r) / len]);
          }
          path.moveTo(...left[0]);
          for (const v of left.slice(1)) path.lineTo(...v);
          for (const v of right.reverse()) path.lineTo(...v);
          path.close();
        }
        return path;
      }
      $('#export').onclick = async () => {
        save();
        if (!window.opentype) {
          $('#status').textContent = '폰트를 만드는 기능을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.';
          return;
        }
        const button = $('#export');
        button.disabled = true;
        try {
          let ko = [];
          if ($('#range').value === '11172') {
            for (let i = 0; i < 11172; i++) ko.push(String.fromCharCode(0xac00 + i));
          } else {
            const bytes = [];
            for (let lead = 0xb0; lead <= 0xc8; lead++)
              for (let trail = 0xa1; trail <= 0xfe; trail++) bytes.push(lead, trail);
            ko = [...new TextDecoder('euc-kr').decode(new Uint8Array(bytes))].filter(
              (c) => c.codePointAt(0) >= 0xac00 && c.codePointAt(0) <= 0xd7a3,
            );
            if (ko.length !== 2350) throw Error('한글 문자 목록을 만들지 못했습니다.');
          }
          const all = [...new Set([...ko, ...SETS.ko, ...SETS.en, ...SETS.num])],
            glyphs = [
              new opentype.Glyph({
                name: '.notdef',
                advanceWidth: 1000,
                path: new opentype.Path(),
              }),
              new opentype.Glyph({
                name: 'space',
                unicode: 32,
                advanceWidth: 500,
                path: new opentype.Path(),
              }),
            ];
          for (let i = 0; i < all.length; i++) {
            const ch = all[i];
            glyphs.push(
              new opentype.Glyph({
                name: 'uni' + ch.codePointAt(0).toString(16),
                unicode: ch.codePointAt(0),
                advanceWidth: 1000,
                path: pathFor(ch),
              }),
            );
            if (i % 200 === 0) {
              $('#status').textContent = '글자 처리 중 ' + i + ' / ' + all.length;
              await new Promise((r) => setTimeout(r, 0));
            }
          }
          const name = $('#family').value.trim() || 'My Handwriting';
          $('#status').textContent = '폰트 저장 중…';
          await new Promise((r) => setTimeout(r, 30));
          const font = new opentype.Font({
              familyName: name,
              styleName: 'Regular',
              designer: $('#designer').value || 'Me',
              unitsPerEm: 1000,
              ascender: 850,
              descender: -150,
              glyphs,
            }),
            buffer = font.toArrayBuffer(),
            url = URL.createObjectURL(
              new Blob([buffer], {
                type: 'font/ttf',
              }),
            ),
            a = document.createElement('a');
          a.href = url;
          a.download = name.replace(/[^a-zA-Z0-9가-힣 _-]/g, '').replace(/\s+/g, '-') + '.ttf';
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 30000);
          $('#status').textContent =
            '저장 완료 · ' +
            all.length.toLocaleString() +
            '자 · ' +
            (buffer.byteLength / 1048576).toFixed(1) +
            ' MB';
        } catch (e) {
          console.error(e);
          $('#status').textContent = '저장 실패: ' + e.message;
        } finally {
          button.disabled = false;
        }
      };
      $('#backup').onclick = () => {
        save();
        const url = URL.createObjectURL(
            new Blob(
              [
                JSON.stringify(
                  {
                    version: 1,
                    glyphs: data,
                    family: $('#family').value,
                    designer: $('#designer').value,
                  },
                  null,
                  2,
                ),
              ],
              {
                type: 'application/json',
              },
            ),
          ),
          a = document.createElement('a');
        a.href = url;
        a.download = 'my-handwriting-backup.json';
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
      };
      $('#restore').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const obj = JSON.parse(await file.text());
          if (obj.version !== 1 || !obj.glyphs || typeof obj.glyphs !== 'object')
            throw Error('이 파일은 불러올 수 없는 백업 형식이에요. My Handwriting Font에서 저장한 JSON 파일인지 확인해 주세요.');
          data = obj.glyphs;
          $('#family').value = obj.family || 'My Handwriting';
          $('#designer').value = obj.designer || 'Me';
          persist();
          pick(letter);
          $('#status').textContent = '불러왔습니다.';
        } catch (err) {
          $('#status').textContent = '불러오기 실패: ' + err.message;
        }
        e.target.value = '';
      };
      pick(letter);
    </script>
  </body>
</html>
