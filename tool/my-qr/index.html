<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff7ec">
<title>My QR · my zip</title>
<link rel="stylesheet" href="../../shared.css">
<style>
.page-title {
  margin:0 0 8px;
  font-size:clamp(2rem,4vw,2.7rem);
  letter-spacing:-.05em}

.intro {
  color:var(--my-muted);
  margin:0 0 22px;
  line-height:1.7}

.layout {
  display:grid;
  grid-template-columns:minmax(0,1.08fr) minmax(280px,.92fr);
  gap:18px;
  align-items:start}

.panel {
  padding:clamp(19px,3vw,30px)}

.panel h2 {
  font-size:1.18rem;
  margin:0 0 20px}

.field {
  display:grid;
  gap:8px;
  margin:0 0 19px}

.field label,.field legend {
  font-size:.94rem;
  color:var(--my-ink)}

.field input:not([type=color]):not([type=file]),.field textarea,.field select {
  display:block;
  width:100%;
  border-radius:14px;
  border:1px solid var(--my-line);
  padding:13px 14px;
  background:rgba(255,255,255,.83);
  color:var(--my-ink);
  font:inherit;
  min-height:48px}

.field textarea {
  min-height:130px;
  resize:vertical;
  line-height:1.55}

.field input:focus-visible,.field textarea:focus-visible,.field select:focus-visible,button:focus-visible {
  outline:3px solid #b9d9e9;
  outline-offset:2px}

.seg {
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:22px}

.seg button {
  background:rgba(255,255,255,.8)!important;
  color:var(--my-ink)!important;
  border:1px solid var(--my-line)!important;
  padding:9px 14px;
  min-height:42px;
  cursor:pointer}

.seg button[aria-pressed=true] {
  background:linear-gradient(135deg,#ffd9eb,#ffc8e1)!important;
  color:#253044!important;
  border-color:transparent!important}

.two {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px}

.picker {
  display:flex;
  align-items:center;
  gap:12px}

.picker input[type=color] {
  width:48px;
  height:44px;
  cursor:pointer;
  border:0;
  background:transparent}

.picker span {
  font-size:.86rem;
  color:var(--my-muted)}

.filepick {
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap}

.filepick input {
  max-width:100%;
  font:inherit;
  font-size:.83rem}

.helper {
  color:var(--my-muted);
  font-size:.83rem;
  line-height:1.65;
  margin:6px 0 0}

.action {
  width:100%;
  padding:11px 16px;
  border:0;
  cursor:pointer;
  font:inherit}

.preview-panel {
  position:sticky;
  top:16px;
  text-align:center}

.qr-frame {
  background:#fff;
  border:1px solid var(--my-line);
  border-radius:22px;
  max-width:390px;
  aspect-ratio:1;
  margin:0 auto 17px;
  padding:16px;
  display:grid;
  place-items:center}

#qr {
  width:100%;
  height:100%;
  image-rendering:pixelated;
  display:none}

#placeholder {
  color:#8992a0;
  font-size:.95rem;
  line-height:1.7}

#status {
  min-height:25px;
  font-size:.89rem;
  color:var(--my-muted);
  margin:0 0 12px}

#status.error {
  color:#d45a97}

.actions {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px}

.actions button {
  padding:10px 8px;
  cursor:pointer;
  font:inherit}

.actions button:disabled {
  opacity:.45;
  cursor:not-allowed}

.privacy {
  margin-top:17px;
  color:var(--my-muted);
  font-size:.83rem;
  line-height:1.65}

[hidden] {
  display:none!important}



body.zip-soft,
body.zip-soft button,
body.zip-soft input,
body.zip-soft textarea,
body.zip-soft select,
body.zip-soft option,
body.zip-soft input::file-selector-button {
  font-family: 'HakgyoansimNadeuriTTF-B', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
}

body.zip-soft button,
body.zip-soft .action {
  background: linear-gradient(135deg, #ffd9eb, #ffc8e1) !important;
  color: #253044 !important;
}

body.zip-soft .seg button {
  background: rgba(255, 255, 255, 0.78) !important;
  color: var(--my-ink) !important;
}

body.zip-soft .seg button[aria-pressed=true] {
  background: linear-gradient(135deg, #ffd9eb, #ffc8e1) !important;
  color: #253044 !important;
}

.field input:not([type=color]):not([type=file]),
.field textarea,
.field select {
  background: rgba(255, 255, 255, 0.86);
  border-color: rgba(133, 141, 160, 0.22);
}

.field input::placeholder,
.field textarea::placeholder {
  color: #94919d;
  opacity: 1;
}

.qr-frame {
  background: #fff;
  border-color: rgba(133, 141, 160, 0.17);
}

.actions button:disabled {
  opacity: 0.5;
}

@media (max-width: 760px) {
  .layout {
    grid-template-columns: 1fr;
  }

  .preview-panel {
    position: static;
  }

  .two {
    grid-template-columns: 1fr;
  }

  .qr-frame {
    max-width: 340px;
  }
}
</style>
<script src="../kiosk-health/vendor/qrcode.js" defer></script>
<script src="./app.js" defer></script>
</head>
<body class="zip-soft">
<nav class="zip-topnav"><a class="zip-home" href="../">← my tool</a><span class="zip-date">Created Nov 16, 2026</span></nav>
<main class="zip-page">
<h1 class="page-title">My QR</h1>
<p class="intro">주소나 텍스트, 연락처를 입력해 QR 코드를 만들 수 있어요.</p>
<div class="layout">
<section class="zip-card panel" aria-label="QR 설정">
<h2>QR 설정</h2>
<div class="seg" role="group" aria-label="내용 유형">
<button type="button" data-kind="url" aria-pressed="true">URL</button>
<button type="button" data-kind="text" aria-pressed="false">텍스트</button>
<button type="button" data-kind="contact" aria-pressed="false">연락처</button>
</div>
<div id="url-fields"><div class="field"><label for="url">URL</label><input id="url" type="url" placeholder="https://example.com" autocomplete="url"></div></div>
<div id="text-fields" hidden><div class="field"><label for="plain">텍스트</label><textarea id="plain" placeholder="QR 코드에 담을 내용을 입력해 주세요."></textarea></div></div>
<div id="contact-fields" hidden>
<div class="field"><label for="contact-name">이름</label><input id="contact-name" autocomplete="name" placeholder="이름"></div>
<div class="field"><label for="contact-phone">전화번호</label><input id="contact-phone" type="tel" autocomplete="tel" placeholder="010-0000-0000"></div>
<div class="field"><label for="contact-email">이메일 (선택)</label><input id="contact-email" type="email" autocomplete="email" placeholder="hello@example.com"></div>
</div>
<div class="two">
<div class="field"><label for="foreground">QR 코드 색상</label><div class="picker"><input id="foreground" type="color" value="#253044"><span id="color-code">#253044</span></div></div>
<div class="field"><label for="background">배경색</label><div class="picker"><input id="background" type="color" value="#ffffff"><span id="bg-code">#ffffff</span></div></div>
</div>
<div class="field"><label for="logo">중앙 이미지</label><div class="filepick"><input id="logo" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></div><p class="helper">PNG·JPG·WebP·GIF 이미지를 넣을 수 있어요. 파일 크기는 2MB까지 지원해요.</p></div>
<button class="action" id="generate" type="button">QR 생성</button>
<p class="helper">QR 코드와 배경색이 너무 비슷하면 인식하기 어려워요. 색을 다르게 선택해 주세요.</p>
</section>
<section class="zip-card panel preview-panel" aria-label="생성된 QR 코드">
<h2>미리보기</h2>
<div class="qr-frame"><canvas id="qr" width="1024" height="1024" role="img" aria-label="생성된 QR 코드"></canvas><div id="placeholder">미리보기</div></div>
<p id="status" role="status" aria-live="polite"></p>
<div class="actions"><button id="png" type="button" disabled>PNG 저장</button><button id="svg" type="button" disabled>SVG 저장</button></div>
<p class="privacy">입력한 정보는 이 브라우저에서 QR 코드로 만들어요. QR 코드를 공유하면 그 안의 정보도 다른 사람이 읽을 수 있어요.</p>
</section>
</div>
</main>
</body>
</html>
